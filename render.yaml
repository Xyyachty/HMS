# Render blueprint for HMS.
#
# Region is Singapore on purpose: the Supabase project lives in ap-southeast-1, and
# co-locating them is the entire reason for deploying. Running the app elsewhere would
# reintroduce the ~144 ms per-query latency this is meant to remove.
#
# Secrets are deliberately NOT in this file. Set them in the Render dashboard
# (Environment -> Environment Variables) so they never enter git.

services:
  - type: web
    name: hms
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    # A static file, served by Apache without touching PHP. Pointing the health
    # check at "/" ties "is the container up?" to "is Laravel and the database
    # working?", so a bad credential reads as a health-check timeout and the
    # deploy is rolled back before anyone can look at it.
    healthCheckPath: /health.txt
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      # Generate once with `php artisan key:generate --show` and paste it in.
      - key: APP_KEY
        sync: false
      - key: APP_URL
        value: https://hms-9ojw.onrender.com

      - key: DB_CONNECTION
        value: pgsql
      - key: DB_PG_HOST
        value: aws-0-ap-southeast-1.pooler.supabase.com
      - key: DB_PG_PORT
        value: "5432"
      - key: DB_PG_DATABASE
        value: postgres
      # Not a secret, and set here rather than by hand on purpose. Supabase's pooler
      # works out which project to route to from the ".<project-ref>" suffix on this
      # username. Leave it off and the connection is refused with
      #   FATAL: (ENOIDENTIFIER) no tenant identifier provided
      # which reads like a network fault rather than a missing username.
      - key: DB_PG_USERNAME
        value: postgres.dbbwcgcfrjobdoskzvtg
      - key: DB_PG_PASSWORD
        sync: false
      # citext lives in the extensions schema; without this the type will not resolve.
      - key: DB_SEARCH_PATH
        value: public,extensions
      - key: DB_SSLMODE
        value: require

      # The filesystem is wiped on every deploy, so neither sessions nor uploads
      # may live on it.
      - key: SESSION_DRIVER
        value: database
      - key: MEDIA_DISK
        value: supabase
      - key: FILESYSTEM_DISK
        value: supabase
      - key: CACHE_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr

      # Student welcome emails go through Brevo's HTTP API, not SMTP. Render blocks
      # outbound traffic on ports 25, 465 and 587 for free web services, so Gmail
      # SMTP from here times out and no student is ever told their password.
      - key: MAIL_MAILER
        value: brevo
      # Must be verified as a sender in Brevo or every send is refused. Students
      # still see this address; only the wire protocol changed.
      - key: MAIL_FROM_ADDRESS
        value: xyron.sandigan15@gmail.com
      - key: MAIL_FROM_NAME
        value: HMS
      # Starts xkeysib-. Dashboard only — it must not enter git.
      - key: BREVO_API_KEY
        sync: false

      - key: SUPABASE_S3_KEY
        sync: false
      - key: SUPABASE_S3_SECRET
        sync: false
      - key: SUPABASE_S3_REGION
        value: ap-southeast-1
      - key: SUPABASE_S3_BUCKET
        value: hms-media
      # Public URLs, not credentials — set here so there are fewer values to type
      # by hand and fewer ways to get them wrong.
      - key: SUPABASE_S3_ENDPOINT
        value: https://dbbwcgcfrjobdoskzvtg.storage.supabase.co/storage/v1/s3
      - key: SUPABASE_S3_PUBLIC_URL
        value: https://dbbwcgcfrjobdoskzvtg.supabase.co/storage/v1/object/public/hms-media
