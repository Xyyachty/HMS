; Upload limits for the container.
;
; The php:8.2-apache image ships PHP's defaults — 2M per file and an 8M body —
; which is smaller than a phone's ten-second clip. Amenity videos are accepted up
; to 50 MB (the ceiling Supabase Storage enforces per object on the free plan), so
; the file limit is set above that and the body limit above the file limit: a
; multipart request carries the rest of the form as well as the video, and PHP
; rejects the whole request, not just the file, when post_max_size is exceeded.
;
; memory_limit is raised for the same request, not for the upload itself: the file
; is streamed to disk, but GD holds a decoded image in memory while a photograph is
; being processed, and 128M is thin for a large one.
upload_max_filesize = 64M
post_max_size = 72M
memory_limit = 256M

; A 50 MB upload over a slow connection can outlast the default 60 seconds of
; input time, which fails with an empty $_FILES rather than an error a person can
; read. The execution limit is the work after the upload, which stays short.
max_input_time = 300
max_execution_time = 120
